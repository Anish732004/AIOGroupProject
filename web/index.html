<title>PharmaShield GCC</title>
<meta name="description" content="PharmaShield GCC: choosing medicine suppliers on evidence, not on price alone. A course prototype for a UAE hospital purchasing group.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M16 6l8 3v7c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V9z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script>
  // theme: ?theme=dark|light in the URL, else the saved choice, else the device setting
  (function () {
    try {
      var q = new URLSearchParams(location.search).get('theme');
      var t = q || localStorage.getItem('pharmashield_theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>

<div class="shell">
  <aside class="side" aria-label="Site">

        <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M16 6l8 3v7c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V9z" fill="#fff"/></svg>
      </span>
      <span><span class="brand-name">PharmaShield GCC</span><span class="brand-sub">Supplier risk cockpit</span></span>
    </a>
    <nav class="nav" id="nav" aria-label="Pages"></nav>
    <div class="side-foot">
      <div id="snapshot-note" class="small muted"></div>
      <button id="theme-toggle" class="btn ghost small-btn" type="button">Switch theme</button>
    </div>
  </aside>
  <main id="main" class="main" tabindex="-1">

  </main>
</div>
